<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente de Fundo Dark Glass -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <!-- Borda Neon Ciano & Esmeralda -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Gradiente dos Elementos Internos -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filtros de Brilho Neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Moldura do Squircle com Borda Neon -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10" filter="url(#outerGlow)" />
  <rect x="36" y="36" width="440" height="440" rx="96" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Reflexo Diagonal de Vidro -->
  <path d="M 128 40 L 384 40 C 440 40 472 72 472 128 L 472 180 L 40 430 L 40 128 C 40 72 72 40 128 40 Z" fill="white" fill-opacity="0.025" />

  <!-- CORPO DA CALCULADORA NO CENTRO -->
  <g filter="url(#neonGlow)">
    <!-- Contorno da Calculadora -->
    <rect x="180" y="128" width="152" height="196" rx="28" fill="rgba(10,25,35,0.6)" stroke="url(#cyanGrad)" stroke-width="12" />
    
    <!-- Visor Superior da Calculadora -->
    <rect x="198" y="148" width="116" height="38" rx="10" fill="url(#cyanGrad)" fill-opacity="0.2" stroke="url(#cyanGrad)" stroke-width="4" />

    <!-- Símbolo + (Mais) -->
    <g fill="url(#cyanGrad)">
      <rect x="220" y="206" width="8" height="28" rx="4" />
      <rect x="210" y="216" width="28" height="8" rx="4" />
    </g>

    <!-- Símbolo - (Menos) -->
    <rect x="272" y="216" width="28" height="8" rx="4" fill="url(#cyanGrad)" />

    <!-- Símbolo × (Vezes) -->
    <g transform="translate(224, 268)">
      <rect x="-12" y="-4" width="24" height="8" rx="4" fill="url(#cyanGrad)" transform="rotate(45)" />
      <rect x="-12" y="-4" width="24" height="8" rx="4" fill="url(#cyanGrad)" transform="rotate(-45)" />
    </g>

    <!-- Símbolo = (Igual) -->
    <g fill="url(#cyanGrad)">
      <rect x="272" y="260" width="28" height="7" rx="3.5" />
      <rect x="272" y="272" width="28" height="7" rx="3.5" />
    </g>
  </g>

  <!-- SÍMBOLO × FLUTUANTE À DIREITA -->
  <g filter="url(#neonGlow)" transform="translate(366, 194)">
    <rect x="-14" y="-4" width="28" height="8" rx="4" fill="url(#emeraldGrad)" transform="rotate(45)" />
    <rect x="-14" y="-4" width="28" height="8" rx="4" fill="url(#emeraldGrad)" transform="rotate(-45)" />
  </g>

  <!-- CARRINHO DE SUPERMERCADO NEON ENVOLVENDO A BASE -->
  <g filter="url(#neonGlow)">
    <!-- Cesto do Carrinho -->
    <path d="M 132 208 L 164 208 L 194 330 C 196 338 204 344 214 344 L 328 344 C 338 344 346 336 348 326 L 368 232" 
          stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Base inferior do Carrinho -->
    <path d="M 194 366 L 324 366" 
          stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Rodinhas do Carrinho -->
    <circle cx="214" cy="392" r="14" fill="url(#emeraldGrad)" />
    <circle cx="304" cy="392" r="14" fill="url(#emeraldGrad)" />
  </g>
</svg>
