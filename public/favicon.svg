<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente do fundo do ícone estilo dark glass -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <!-- Borda chanfrada metálica -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Brilho Neon Cyan -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Brilho Neon Emerald -->
    <filter id="neonGlowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Corpo do Squircle (Glass) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Reflexo de Vidro Diagonal -->
  <path d="M 136 36 L 376 36 C 440 36 476 72 476 136 L 476 220 L 36 440 L 36 136 C 36 72 72 36 136 36 Z" fill="white" fill-opacity="0.03" />

  <!-- Símbolo + (Cyan) -->
  <g filter="url(#neonGlowCyan)">
    <rect x="176" y="120" width="24" height="88" rx="12" fill="url(#cyanGrad)" />
    <rect x="144" y="152" width="88" height="24" rx="12" fill="url(#cyanGrad)" />
  </g>

  <!-- Símbolo − (Emerald) -->
  <g filter="url(#neonGlowEmerald)">
    <rect x="280" y="152" width="88" height="24" rx="12" fill="url(#emeraldGrad)" />
  </g>

  <!-- Símbolo × (Cyan) -->
  <g filter="url(#neonGlowCyan)">
    <rect x="144" y="324" width="88" height="24" rx="12" fill="url(#cyanGrad)" transform="rotate(45 188 336)" />
    <rect x="144" y="324" width="88" height="24" rx="12" fill="url(#cyanGrad)" transform="rotate(-45 188 336)" />
  </g>

  <!-- Símbolo = (Emerald) -->
  <g filter="url(#neonGlowEmerald)">
    <rect x="280" y="296" width="96" height="22" rx="11" fill="url(#emeraldGrad)" />
    <rect x="280" y="340" width="96" height="22" rx="11" fill="url(#emeraldGrad)" />
  </g>

  <!-- Símbolo ÷ (Cyan/Emerald Central) -->
  <g filter="url(#neonGlowEmerald)">
    <circle cx="324" cy="226" r="8" fill="url(#emeraldGrad)" />
    <rect x="296" y="244" width="56" height="18" rx="9" fill="url(#emeraldGrad)" />
    <circle cx="324" cy="278" r="8" fill="url(#emeraldGrad)" />
  </g>
</svg>
